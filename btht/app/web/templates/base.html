<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BT Hardening Tool{% endblock %}</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1a1d21; --muted:#5c6470; --line:#d8dce2;
  --accent:#1f5f8b; --accent-soft:#e8f1f7;
  --ok:#1e6b45; --ok-soft:#e6f2ec;
  --warn:#8a5a00; --warn-soft:#fdf3e0;
  --err:#9a2c2c; --err-soft:#fbecec;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14171a; --panel:#1c2025; --ink:#e6e8eb; --muted:#98a1ad; --line:#2f353d;
    --accent:#6fa8cc; --accent-soft:#1b2a35;
    --ok:#7cc4a0; --ok-soft:#16241d;
    --warn:#e0b25e; --warn-soft:#2a2115;
    --err:#e08a8a; --err-soft:#2b1a1a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:22px 20px 80px}
h1{font-size:19px;margin:0 0 4px}
h2{font-size:15px;margin:26px 0 10px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:16px 18px;margin-bottom:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
code,.mono{font-family:var(--mono);font-size:12.5px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
input,select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
button{background:var(--accent);color:#fff;border:0;border-radius:5px;padding:8px 14px;
  font:inherit;font-size:13px;cursor:pointer;margin-top:12px}
button.quiet{background:transparent;color:var(--accent);border:1px solid var(--line)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>div{flex:1;min-width:150px}
.note{border-radius:6px;padding:9px 12px;font-size:12.5px;margin-bottom:14px}
.note.warn{background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn)}
.note.ok{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ok)}
.note.err{background:var(--err-soft);border:1px solid var(--err);color:var(--err)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;
  background:var(--accent-soft);color:var(--accent);font-family:var(--mono)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
a{color:var(--accent)}
.btn{display:inline-block;text-decoration:none;font:inherit;font-size:12.5px;
  padding:7px 13px;border-radius:5px;background:var(--accent);color:#fff;border:0;
  cursor:pointer;line-height:1.3}
.btn:hover{filter:brightness(1.08)}
.btn.quiet{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.small{font-size:11.5px;padding:4px 9px}
.btn.danger{background:transparent;color:var(--err);border:1px solid var(--err)}
.tiles{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.tile{flex:1 1 220px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:15px 17px;text-decoration:none;color:var(--ink);display:block}
.tile:hover{border-color:var(--accent)}
.tile.here{border-color:var(--accent);background:var(--accent-soft)}
.tile.add{border-style:dashed}
.tile.add .count{color:var(--muted)}
.tile h3{margin:0 0 4px;font-size:14px}
.tile p{margin:0;color:var(--muted);font-size:12.5px}
.tile .count{font-family:var(--mono);font-size:20px;color:var(--accent);display:block;margin-bottom:4px}
.mainnav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.navtile{flex:1 1 150px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:10px 13px;text-decoration:none;color:var(--ink)}
.navtile:hover{border-color:var(--accent)}
.navtile.here{border-color:var(--accent);background:var(--accent-soft)}
.navtile strong{display:block;font-size:13px}
.navtile span{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
<nav class="mainnav">
  <a class="navtile {% if page == 'range' %}here{% endif %}" href="/range">
    <strong>Range</strong><span>enclaves, interfaces, hosts</span></a>
  <a class="navtile {% if page == 'topology' %}here{% endif %}" href="/range/topology">
    <strong>Topology</strong><span>the range drawn</span></a>
  <a class="navtile {% if page == 'services' %}here{% endif %}" href="/services">
    <strong>Service templates</strong><span>what a machine runs</span></a>
  <a class="navtile {% if page == 'types' %}here{% endif %}" href="/services#types">
    <strong>Host templates</strong><span>kinds of machine</span></a>
  <a class="navtile {% if page == 'monitor' %}here{% endif %}" href="/range/monitor">
    <strong>Monitor</strong><span>what changed</span></a>
</nav>
{% for kind, message in messages %}<div class="note {{ kind }}">{{ message }}</div>{% endfor %}
{% block body %}{% endblock %}
</div>
</body>
</html>
