name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: lint
        run: uv run ruff check .
      - name: typecheck
        run: uv run mypy
      - name: test
        run: uv run pytest
